<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan Kualitas Produk</title>
</head>

<body>
    <header>
        <h1>Laporan Kualitas Produk</h1>
        <p>Formulir Laporan Inspeksi Kualitas</p>
        <h5>Dibuat oleh : Radhitya Adha F R (23051430005)</h5>
        <hr>
    </header>

    <section>
        <form action="">

            <!-- ID Produk -->
            <label for="id_produk">ID Produk :</label>
            <input type="text" id="id_produk" name="id_produk"
                placeholder="Masukkan ID Produk" required><br><br>

            <!-- Nama Inspektur -->
            <label for="nama_inspektur">Nama Inspektur :</label>
            <input type="text" id="nama_inspektur" name="nama_inspektur"
                placeholder="Masukkan Nama Inspektur" required><br><br>

            <!-- Jenis Cacat -->
            <label>Jenis Cacat :</label><br>

            <input type="radio" id="geometri" name="jenis_cacat"
                value="Geometri" required>
            <label for="geometri">Geometri</label><br>

            <input type="radio" id="permukaan" name="jenis_cacat"
                value="Permukaan">
            <label for="permukaan">Permukaan</label><br>

            <input type="radio" id="fungsional" name="jenis_cacat"
                value="Fungsional">
            <label for="fungsional">Fungsional</label><br><br>

            <!-- Jumlah Cacat -->
            <label for="jumlah_cacat">Jumlah Cacat :</label>
            <input type="number" id="jumlah_cacat" name="jumlah_cacat"
                placeholder="Masukkan Jumlah Cacat"
                min="0" required><br><br>

            <!-- Foto Produk -->
            <label for="foto_produk">Upload Foto Produk :</label>
            <input type="file" id="foto_produk" name="foto_produk"
                accept="image/*"><br><br>

            <button type="submit">Simpan Laporan</button>

        </form>
    </section>
</body>

</html>
