<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Kontrol Mesin</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body>

    <!-- Simulasi Panel Kontrol Mesin (Meeting 6) -->
    <div id="panelMesin" class="card mt-4 mx-auto" style="max-width: 700px;">
        
        <div class="card-header bg-dark text-white">
            Panel Kontrol Mesin-01
        </div>

        <div class="card-body text-center">

            <!-- Indikator Status -->
            <div id="statusIndicator" class="alert alert-secondary" role="alert">
                Status: <strong>UNKNOWN</strong>
            </div>

            <!-- Tampilan Suhu -->
            <h2 id="suhuMesin">25 °C</h2>
            <p>Suhu Operasional Saat Ini</p>

            <!-- Input RPM -->
            <div class="mt-3">
                <label class="form-label">
                    Set Target Kecepatan (RPM):
                </label>

                <input
                    type="number"
                    id="inputRPM"
                    class="form-control"
                    placeholder="Max 2000 RPM"
                >

                <small id="pesanError" class="text-danger d-none">
                    RPM melebihi batas aman!
                </small>
            </div>

            <!-- Tombol Kontrol -->
            <div class="d-grid gap-2 d-md-block mt-4">
                <button id="btnStart" class="btn btn-success btn-lg">
                    START
                </button>

                <button id="btnStop" class="btn btn-danger btn-lg" disabled>
                    STOP
                </button>

                <button id="btnReset" class="btn btn-warning btn-lg">
                    RESET
                </button>

                <button id="btnMaintenance" class="btn btn-secondary btn-lg">
                    MAINTENANCE MODE
                </button>
            </div>

        </div>
    </div>

    <!-- JavaScript -->
    <script src="pertemuan6.js"></script>

</body>
</html>
