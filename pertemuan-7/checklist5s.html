<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checklist Audit 5S</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-5">

    <h2 class="mb-4">Checklist Audit 5S</h2>

    <div class="row">

        <!-- Form Input -->
        <div class="col-md-4">
            <div class="card">
                <div class="card-header">Form Audit</div>
                <div class="card-body">

                    <form id="formAudit">

                        <div class="mb-3">
                            <label>Nama Auditor</label>
                            <input type="text" id="auditor" class="form-control" required>
                        </div>

                        <label class="fw-bold">Checklist 5S</label>

                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="seiri">
                            <label class="form-check-label">Seiri (Ringkas)</label>
                        </div>

                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="seiton">
                            <label class="form-check-label">Seiton (Rapi)</label>
                        </div>

                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="seiso">
                            <label class="form-check-label">Seiso (Resik)</label>
                        </div>

                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="seiketsu">
                            <label class="form-check-label">Seiketsu (Rawat)</label>
                        </div>

                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" id="shitsuke">
                            <label class="form-check-label">Shitsuke (Rajin)</label>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">
                            Simpan Audit
                        </button>

                        <button type="button" id="btnHapusSemua" class="btn btn-danger w-100 mt-2">
                            Hapus Semua Data
                        </button>

                    </form>
                </div>
            </div>
        </div>

        <!-- Tabel -->
        <div class="col-md-8">
            <h4>Riwayat Audit 5S</h4>

            <table class="table table-bordered table-striped">
                <thead class="table-dark">
                    <tr>
                        <th>Tanggal</th>
                        <th>Auditor</th>
                        <th>Skor (%)</th>
                    </tr>
                </thead>
                <tbody id="tabelBody">
                </tbody>
            </table>
        </div>

    </div>

    <script src="checklist5s.js"></script>
</body>
</html>
