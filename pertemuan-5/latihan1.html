<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Perhitungan Lingkaran</title>
  <link rel="stylesheet" href="Latihan1.css">
</head>

<body>

  <div class="card">

    <header>
      <h2>Perhitungan Lingkaran</h2>
      <p>Aplikasi sederhana untuk menghitung luas dan keliling</p>
    </header>

    <div class="input-area">
      <label for="jariJari">Nilai Jari-jari</label>
      <input type="number" id="jariJari" placeholder="Masukkan nilai...">
      <button onclick="hitung()">Proses Hitung</button>
    </div>

    <div class="result-area">
      <h3>Output</h3>
      <p id="luas">Luas : -</p>
      <p id="keliling">Keliling : -</p>
    </div>

  </div>

  <script src="latihan1.js"></script>

</body>
</html>
