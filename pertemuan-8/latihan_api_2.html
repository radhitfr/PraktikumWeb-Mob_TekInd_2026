<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Data Karyawan (Dari Server)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="stylelatihan.css">
</head>

<body>

<div class="container mt-5">

    <h2 class="mb-4">Data Karyawan (Dari Server)</h2>
    <div class="d-flex flex-wrap gap-2 align-items-center mb-4">
        <button id="btnLoad" class="btn btn-primary">Muat Data dari API</button>
        <button id="btnFilter" class="btn btn-warning">Filter Kota "s"</button>
        <button class="btn btn-success ms-auto" data-bs-toggle="modal" data-bs-target="#modalTambah">
            Tambah Karyawan Baru
        </button>
        <div id="loading" class="spinner-border text-primary d-none"></div>
    </div>
    <div class="row" id="containerKaryawan"></div>
</div>
<!-- MODAL -->
<div class="modal fade" id="modalTambah">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Tambah Karyawan</h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                <input type="text" id="inputNama" class="form-control mb-2" placeholder="Nama">
                <input type="email" id="inputEmail" class="form-control mb-2" placeholder="Email">
                <input type="text" id="inputPerusahaan" class="form-control mb-2" placeholder="Perusahaan">
                <input type="text" id="inputKota" class="form-control" placeholder="Kota">
            </div>

            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                <button id="btnSubmitTambah" class="btn btn-primary">Simpan</button>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="latihan_api_2.js"></script>

</body>
</html>
